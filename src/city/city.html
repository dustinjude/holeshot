<div class="wrap" id="wrap" data-tab="city">
  <div class="top"><h1>Side Hustle Holeshot</h1><button id="free">Free play</button></div>
  <p class="tag" id="tag"></p>
  <div class="hud">
    <div class="status"><b id="clock"></b><b class="cash" id="cash"></b><span class="stars" id="stars" aria-label="Wanted level"></span><span id="rent" style="font-size:14px"></span><button class="ph" id="phone"></button></div>
    <div class="meters" id="meters"></div>
  </div>
  <div class="main">
    <div class="mapbox pane-city"><svg class="map" id="map" viewBox="0 0 400 300" role="group" aria-label="City map"></svg></div>
    <div class="panel pane-city" id="here"></div>
  </div>
  <div class="lower">
    <div class="panel pane-people"><h2>People</h2><p class="key"><i class="dot"></i>Bond: how close you are. <i class="dot t"></i>Trust: whether they believe you. Tap a name for more.</p><div id="people"></div></div>
    <div class="panel pane-you"><h2>You</h2><div id="you"></div></div>
    <div class="panel pane-log"><h2>Street log</h2><div class="log" id="log"></div><div style="margin-top:12px"><button id="reset">Start a new life <small>wipes save</small></button></div></div>
  </div>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"><button data-tab="city" aria-pressed="true">City</button><button data-tab="people" aria-pressed="false">People</button><button data-tab="you" aria-pressed="false">You</button><button data-tab="log" aria-pressed="false">Log</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
