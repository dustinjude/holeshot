<div class="app" id="app" data-tab="here">
  <header class="hud" id="hud">
    <div class="hud1"><b class="clock" id="clock"></b><b class="cash" id="cash"></b><span class="stars" id="stars" role="img"></span><button class="ph" id="phone" aria-label="Phone"><i id="phico"></i><em id="badge"></em></button></div>
    <div class="meters" id="meters"></div>
  </header>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <main>
    <section class="pane pane-here" id="here"></section>
    <section class="pane pane-map"><div class="mapwrap"><svg class="map" id="map" viewBox="0 0 400 560" role="group" aria-label="City map"></svg><div class="mapover" id="mapover"></div></div><div class="mapgoals" id="mapgoals"></div></section>
    <section class="pane pane-hustle" id="hustle"></section>
    <section class="pane pane-people" id="people"></section>
    <section class="pane pane-you" id="you"></section>
  </main>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="here" aria-pressed="true"><i data-i="here"></i><span>Here</span></button>
    <button data-tab="map" aria-pressed="false"><i data-i="map"></i><span>Map</span></button>
    <button data-tab="hustle" aria-pressed="false"><i data-i="case"></i><span>Hustles</span></button>
    <button data-tab="people" aria-pressed="false"><i data-i="people"></i><span>People</span></button>
    <button data-tab="you" aria-pressed="false"><i data-i="user"></i><span>You</span></button>
  </nav>
</div>
<div class="phoneui" id="phoneui" hidden><div class="pbox"><div class="pbar"><span>Side Hustle Mobile</span><button data-pclose aria-label="Put the phone away">Put it away</button></div><div class="pscreen" id="pscreen"></div></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
