<div class="wrap">
  <div class="top"><h1>Side Hustle Holeshot</h1><button id="free">Free play</button></div>
  <p class="tag" id="tag"></p>
  <div class="main">
    <div>
      <div class="status"><b id="clock"></b><b class="cash" id="cash"></b><span class="stars" id="stars" aria-label="Wanted level"></span><span id="rent" style="font-size:14px"></span><button class="ph" id="phone"></button></div>
      <div class="meters" id="meters"></div>
      <div class="mapbox"><svg class="map" id="map" viewBox="0 0 400 300" role="group" aria-label="City map"></svg></div>
    </div>
    <div class="panel" id="here"></div>
  </div>
  <div class="lower">
    <div class="panel"><h2>People</h2><p class="key"><i class="dot"></i>Bond: how close you are. <i class="dot t"></i>Trust: whether they believe you. Tap a name for more.</p><div id="people"></div></div>
    <div class="panel"><h2>You</h2><div id="you"></div></div>
    <div class="panel"><h2>Street log</h2><div class="log" id="log"></div><div style="margin-top:12px"><button id="reset">Start a new life <small>wipes save</small></button></div></div>
  </div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
